# Local admin dashboard: Grafana + Postgres datasource pointing at the
# Fly-hosted mytravelpal-db through a `flyctl proxy` tunnel that runs in
# this same stack (service `fly-proxy`), so one command brings up both.
#
# Usage:
#   1. Copy `.env.example` to `.env` and fill in PG_* creds and
#      FLY_API_TOKEN (see the comments there).
#   2. docker compose up -d        (or `make dashboard-up` from the root)
#   3. Open http://localhost:3007 (login admin / admin, force reset on first login)
#
# Both services use host networking, so Grafana reaches the tunnel on
# `localhost:5432`. Do NOT also run `flyctl proxy 5432` by hand while this
# stack is up: both would try to bind the same port.

services:
  fly-proxy:
    image: flyio/flyctl:latest
    container_name: mytravelpal-db-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      FLY_API_TOKEN: ${FLY_API_TOKEN:?set FLY_API_TOKEN in dashboard/.env, see .env.example}
    # Loopback only: the database must not become reachable from the LAN.
    command:
      - proxy
      - "${PG_PORT:-5432}"
      - -a
      - "${FLY_DB_APP:-mytravelpal-db}"
      - --bind-addr
      - "127.0.0.1"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: mytravelpal-dashboard
    restart: unless-stopped
    # host networking so `localhost:5432` inside the container maps
    # to the flyctl proxy running on the host's loopback. Without
    # this the container can't reach 127.0.0.1:5432 even with
    # `host.docker.internal` — the proxy binds to loopback only,
    # not the docker0 bridge that host.docker.internal points at.
    # Linux-only; on macOS/Windows use `flyctl proxy --bind-addr 0.0.0.0`
    # + drop `network_mode` + keep `ports` and `host.docker.internal`.
    network_mode: host
    depends_on:
      - fly-proxy
    environment:
      GF_SERVER_HTTP_PORT: 3007
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Datasource variables interpolated in provisioning/*.yml.
      # host = localhost because the container shares the host net.
      PG_HOST: ${PG_HOST:-localhost}
      PG_PORT: ${PG_PORT:-5432}
      PG_DATABASE: ${PG_DATABASE}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage: {}
