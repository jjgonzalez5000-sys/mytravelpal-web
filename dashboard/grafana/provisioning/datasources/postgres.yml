apiVersion: 1

datasources:
  - name: MyTravelPal Postgres
    type: postgres
    uid: mytravelpal-db
    access: proxy
    url: "$PG_HOST:$PG_PORT"
    user: $PG_USER
    database: $PG_DATABASE
    isDefault: true
    editable: true
    secureJsonData:
      password: $PG_PASSWORD
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
