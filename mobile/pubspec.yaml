name: mytravelpal
description: MyTravelPal — road-trip planning app.
publish_to: 'none'
version: 0.2.85+90

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  intl: ^0.20.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  sensors_plus: ^6.0.1
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  tutorial_coach_mark: ^1.2.11
  sentry_flutter: ^9.0.0
  local_auth: ^2.3.0
  flutter_tts: ^4.2.0
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1
  # sign_in_with_apple removed 2026-08-29 — Android-only. Restore
  # when iOS ships (Apple App Store §4.8 requires the button).
  app_links: ^6.3.2
  flutter_local_notifications: ^18.0.1
  # Keeps the screen on while the trip dashboard is foregrounded so
  # the driver can glance at the countdown / next-stop card without
  # the phone dimming to sleep every minute. Released on dispose.
  wakelock_plus: ^1.2.8
  # In-app review — surfaces the native Play Store rating dialog
  # without leaving the app. Google throttles quotas at the OS level
  # so calling it is safe; the sheet only appears on a subset of
  # sessions the Play policy allows.
  in_app_review: ^2.0.9
  # Foreground service so Android doesn't OOM-kill the app while it's
  # backgrounded during a trip (typically while the driver flips to
  # Google Maps for turn-by-turn). Without this the trip dashboard
  # gets killed after ~30 s minimised on most Xiaomi/Samsung ROMs.
  flutter_foreground_task: ^8.10.0
  timezone: ^0.9.4
  # Material You dynamic colour — pulls a ColorScheme from the
  # user's wallpaper on Android 12+. Silently returns null on
  # older Android / iOS so we can fall back to the curated preset.
  dynamic_color: ^1.7.0
  # Device address-book access so the user can pick emergency
  # contacts from their phone instead of typing name + E.164
  # manually. Requires READ_CONTACTS permission (added to the
  # Android manifest) and a runtime prompt on first use.
  flutter_contacts: ^1.1.9+2
  # Lottie micro-animations for key moments (plan loading, trip
  # saved toast, arriving hint). Keeps binary size small — JSON
  # vector animations, not video.
  lottie: ^3.1.2
  # Google Play Billing — subscriptions paywall (Essential + Premium).
  # Uses the official Flutter plugin backed by Play Billing Library 6+.
  in_app_purchase: ^3.2.0
  # Screenshot attachments in feedback sheet.
  image_picker: ^1.1.2
  # Audio playback for OpenAI TTS narrative. Plays the MP3 bytes
  # returned by /v1/trips/narrative/audio; falls back to flutter_tts
  # when the backend has no OPENAI_API_KEY.
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Integration tests + full-auto Play Store screenshot capture
  # via `tool/take_screenshots_auto.sh`. Screenshots are shipped
  # to `store_assets/play_console/screenshots/` from the host
  # side via `test_driver/screenshots_test.dart`.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/lottie/
    - assets/changelogs/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-var.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-var.ttf
