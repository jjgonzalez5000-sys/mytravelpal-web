name: mytravelpal
description: MyTravelPal — road-trip planning app.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  intl: ^0.20.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  tutorial_coach_mark: ^1.2.11
  flutter_tts: ^4.2.0
  share_plus: ^10.1.4
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1
  sign_in_with_apple: ^6.1.4
  app_links: ^6.3.2
  flutter_local_notifications: ^18.0.1
  # Keeps the screen on while the trip dashboard is foregrounded so
  # the driver can glance at the countdown / next-stop card without
  # the phone dimming to sleep every minute. Released on dispose.
  wakelock_plus: ^1.2.8
  # In-app review — surfaces the native Play Store rating dialog
  # without leaving the app. Google throttles quotas at the OS level
  # so calling it is safe; the sheet only appears on a subset of
  # sessions the Play policy allows.
  in_app_review: ^2.0.9
  # Foreground service so Android doesn't OOM-kill the app while it's
  # backgrounded during a trip (typically while the driver flips to
  # Google Maps for turn-by-turn). Without this the trip dashboard
  # gets killed after ~30 s minimised on most Xiaomi/Samsung ROMs.
  flutter_foreground_task: ^8.10.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
