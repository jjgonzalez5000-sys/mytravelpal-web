<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon proposal D: "north-star route".
  Single strong glyph on a warm daylight gradient. A soft
  meandering road climbs from the bottom edge into a distinctive
  eight-point star (the wayfinder / north-star metaphor).
  Different from v1 in three ways:
    1. One iconic shape (star) instead of a pin — less generic,
       harder to confuse with Google Maps' amber pin.
    2. Warm daylight gradient (sky teal → soft cream) rather than
       navy — reads as journey / horizon / anticipation.
    3. The road terminates INSIDE the star, not next to it — the
       destination IS the star; the composition converges.
  Silhouette is dominated by the star: identifiable at 48×48.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78CFE6"/>
      <stop offset="0.55" stop-color="#F3D592"/>
      <stop offset="1" stop-color="#EA7B54"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFF6D6"/>
      <stop offset="1" stop-color="#F5B04B"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Soft meandering road that climbs into the star -->
  <path
    d="M 210 500
       C 190 430, 300 400, 268 320
       C 240 250, 310 210, 260 170"
    stroke="url(#road)" stroke-width="46" stroke-linecap="round"
    fill="none"/>
  <!-- Dashed centreline -->
  <path
    d="M 210 500
       C 190 430, 300 400, 268 320
       C 240 250, 310 210, 260 170"
    stroke="#B04A26" stroke-width="6" stroke-linecap="round"
    stroke-dasharray="14 22" fill="none" opacity="0.55"/>

  <!-- Eight-point wayfinder star -->
  <g transform="translate(256 172)">
    <circle r="86" fill="#FFFFFF" opacity="0.18"/>
    <!--
      Eight-point star: 16 vertices alternating outer (r=100) and
      inner (r=42) every 22.5°, starting from 12 o'clock going
      clockwise. Pre-computed so cairosvg renders it identically
      across densities.
    -->
    <path d="M 0 -100
             L 16 -39 L 71 -71 L 39 -16
             L 100 0   L 39 16   L 71 71   L 16 39
             L 0 100   L -16 39  L -71 71  L -39 16
             L -100 0  L -39 -16 L -71 -71 L -16 -39 Z"
          fill="url(#star)" stroke="#B04A26" stroke-width="5"
          stroke-linejoin="round"/>
    <circle r="12" fill="#B04A26"/>
  </g>
</svg>
