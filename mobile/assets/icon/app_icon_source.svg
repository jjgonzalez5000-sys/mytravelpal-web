<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source SVG for the MyTravelPal app icon.
  Design: a stylised road curving inland from bottom to a location
  pin at the top, on a deep-blue rounded-square background. The road
  glyph carries the "route planner" idea; the pin says "destination".
  Colour palette matches the app's primary tint (used in drawable/
  widget_background.xml).

  Regenerate mipmaps with `docs/regenerate_icon.md` instructions or
  the one-liner in the shipping notes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E7BC4"/>
      <stop offset="1" stop-color="#0A4A80"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Road curve: bottom-left, sweeps up and right, tapers to the pin -->
  <path
    d="M 120 460
       C 120 400, 200 360, 220 300
       C 240 240, 180 200, 220 150
       C 260 100, 340 130, 340 90"
    stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"
    fill="none"
    opacity="0.95"/>
  <!-- Dashed road stripes -->
  <path
    d="M 120 460
       C 120 400, 200 360, 220 300
       C 240 240, 180 200, 220 150
       C 260 100, 340 130, 340 90"
    stroke="#0A4A80" stroke-width="6" stroke-linecap="round"
    fill="none"
    stroke-dasharray="12 24"/>

  <!-- Destination pin on top of the curve -->
  <g transform="translate(340 90)">
    <path d="M 0 -60
             C -34 -60, -60 -34, -60 0
             C -60 30, -20 65, 0 90
             C 20 65, 60 30, 60 0
             C 60 -34, 34 -60, 0 -60 Z"
          fill="#F4C542" stroke="#0A4A80" stroke-width="6"/>
    <circle cx="0" cy="-5" r="20" fill="#FFFFFF"/>
  </g>
</svg>
