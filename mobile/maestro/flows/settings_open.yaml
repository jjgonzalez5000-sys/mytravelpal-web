appId: com.mytravelpal.travel
---
# Smoke test: navigate to Settings and verify key sections exist.
# Entry point: PlanScreen AppBar settings icon (tooltip "Ajustes").
- launchApp
- waitForAnimationToEnd:
    timeout: 3000
# Tap the settings gear icon in the PlanScreen AppBar
- tapOn:
    text: "Ajustes"
    optional: false
- waitForAnimationToEnd:
    timeout: 2000
# Verify the Settings screen title appeared
- assertVisible:
    text: "Ajustes"
# Verify the first section (Apariencia) is visible without scrolling
- assertVisible:
    text: "Apariencia"
# Scroll down to reach the "Acerca de" section at the bottom
- scrollUntilVisible:
    element:
      text: "Versión"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Versión"
