appId: com.mytravelpal.travel
---
- launchApp:
    permissions: { all: allow }
- extendedWaitUntil:
    visible: "Desde|From"
    timeout: 60000
- tapOn: "Ajustes|Settings"
- waitForAnimationToEnd
- assertVisible: "Ajustes|Settings"
- scrollUntilVisible:
    element: ".*(Apariencia|Appearance).*"
    direction: DOWN
- scrollUntilVisible:
    element: ".*(Cuenta|Account).*"
    direction: DOWN
