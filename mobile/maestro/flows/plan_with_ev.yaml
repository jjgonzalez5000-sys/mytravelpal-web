appId: com.mytravelpal.travel
---
# Override the trip profile to an electric vehicle from the plan form.
- launchApp:
    permissions: { all: allow }
- extendedWaitUntil:
    visible: "Desde|From"
    timeout: 60000
- tapOn: "Sobrescribir para este viaje|Override for this trip"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Eléctrico|Electric"
    direction: DOWN
- tapOn: "Eléctrico|Electric"
- waitForAnimationToEnd
- tapOn: "Usar|Use"
- waitForAnimationToEnd
- assertVisible: ".*(Eléctrico|Electric).*"
