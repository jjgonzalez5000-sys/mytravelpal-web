appId: com.mytravelpal.travel
---
- launchApp:
    permissions: { all: allow }
- extendedWaitUntil:
    visible: "Desde|From"
    timeout: 60000
- tapOn: "Ajustes|Settings"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: ".*(Apariencia|Appearance).*"
    direction: DOWN
- tapOn: ".*(Apariencia|Appearance).*"
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: ".*(Idioma|Language).*"
    commands:
      - tapOn: ".*(Apariencia|Appearance).*"
      - waitForAnimationToEnd
- tapOn: ".*(Idioma|Language).*"
- waitForAnimationToEnd
- tapOn: ".*Español.*"
- waitForAnimationToEnd
- pressKey: Back
- waitForAnimationToEnd
- assertVisible: "Desde"
# Restore English so the order of flows never matters.
- tapOn: "Ajustes"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: ".*(Apariencia|Appearance).*"
    direction: DOWN
- runFlow:
    when:
      notVisible: ".*(Idioma|Language).*"
    commands:
      - tapOn: ".*(Apariencia|Appearance).*"
      - waitForAnimationToEnd
- tapOn: ".*(Idioma|Language).*"
- waitForAnimationToEnd
- tapOn: ".*English.*"
- waitForAnimationToEnd
- assertVisible: "Settings"
