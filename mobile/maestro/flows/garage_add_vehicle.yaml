appId: com.mytravelpal.travel
---
# Settings -> Garage -> Add vehicle opens the wizard.
- launchApp:
    permissions: { all: allow }
- extendedWaitUntil:
    visible: "Desde|From"
    timeout: 60000
- tapOn: "Ajustes|Settings"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Mi garaje.*|My garage.*"
    direction: DOWN
- tapOn: "Mi garaje.*|My garage.*"
- waitForAnimationToEnd
- tapOn: "Añadir vehículo|Add vehicle"
- waitForAnimationToEnd
- assertVisible: "Turismo|Car"
