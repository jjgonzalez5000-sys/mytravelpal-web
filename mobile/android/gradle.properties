org.gradle.jvmargs=-Xmx24G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=1G -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --add-opens=java.base/java.lang.ref=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.workers.max=16
org.gradle.caching=true
org.gradle.daemon=true
# Continuous file-system watcher — Gradle skips the re-scan of the
# whole project when only a handful of files changed between builds.
org.gradle.vfs.watch=true
# Only configure the projects the current build actually touches.
org.gradle.configureondemand=true
# Priority normal (default is 'normal' for daemon; explicit for clarity).
org.gradle.priority=normal

kotlin.daemon.jvmargs=-Xmx12G -XX:+UseG1GC -XX:ReservedCodeCacheSize=512m
kotlin.incremental=true
# Turn on Kotlin's parallel-per-module compilation.
kotlin.parallel.tasks.in.project=true
# K2 compiler — 1.5-2× faster on Kotlin 2.x. Flutter's Android
# template ships on Kotlin 2.x so it's safe here.
kotlin.experimental.tryK2=true

# Gradle configuration-cache is DISABLED — Flutter's DependencyVersionChecker
# task references a Kotlin FutureImpl that isn't cacheable ("Future was
# not completed yet"), and problems=warn doesn't help because Gradle
# treats task-graph write errors as fatal. --add-opens flags above are
# a partial fix for one of the barriers; re-enable when Flutter drops
# ReleaseMinSdkCheck or migrates it to a cache-safe task.
# org.gradle.configuration-cache=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# AGP-level parallel switches — cheap wins.
android.enableParallelJsonGen=true
# Skip Jetifier at startup (all our deps are AndroidX-native).
android.enableJetifier=false
# Newer AGP: precise resource shrinking, faster than the legacy path.
android.experimental.enableNewResourceShrinker.preciseShrinking=true
