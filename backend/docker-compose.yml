services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: mytravelpal
      POSTGRES_PASSWORD: mytravelpal
      POSTGRES_DB: mytravelpal
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mytravelpal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://mytravelpal:mytravelpal@db:5432/mytravelpal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests

volumes:
  db_data:
