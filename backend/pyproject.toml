[project]
name = "mytravelpal-backend"
version = "0.1.0"
description = "MyTravelPal backend: trip planning API with optimal-departure-window computation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "greenlet>=3.0",
    "geoalchemy2>=0.15",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "sentry-sdk[fastapi]>=2.0",
    "pyjwt>=2.9",
    "google-auth[requests]>=2.35",
    # RainViewer live-radar tile sampling. Companion mode downloads
    # a 256 px PNG tile at the driver's next-hop coord and inspects
    # a 5x5 pixel window to detect precipitation reflectivity.
    # If the Fly wheel is unavailable, `rain_radar.py` degrades to a
    # tile-size heuristic (bytes > 1 KB => has-precipitation).
    "pillow>=10.0",
    # In-process TTL cache used as fallback for the plan endpoint
    # when Redis is unavailable (no REDIS_URL / connect fails).
    "cachetools>=5.3",
    # HERE Routing v8 returns polylines in their Flexible Polyline
    # format — we decode them for the toll-skip alternative
    # visualisation on the day map so the driver sees the actual
    # secondary road they'd take instead of a rough straight line.
    "flexpolyline>=0.1.0",
    # OpenAI TTS for natural-sounding trip narrative audio.
    # Only used when OPENAI_API_KEY is set — falls back to an empty
    # response that tells the client to use device TTS.
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
