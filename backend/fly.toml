# fly.toml app configuration file generated for mytravelpal-api on 2026-08-21T22:41:17+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mytravelpal-api'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  MYTRAVELPAL_FIRES = 'effis'
  # USGS FDSN earthquake feed (free, keyless). Filtered to route bbox
  # with a 24 h lookback + minmagnitude 4.5 downstream.
  MYTRAVELPAL_QUAKES = 'usgs'
  # Open-Meteo daily-max heatwave synth (threshold 38 °C). One extra
  # HTTP round-trip per /plan; keyless.
  MYTRAVELPAL_HEATWAVE = 'on'
  MYTRAVELPAL_ROUTING = 'osrm'
  MYTRAVELPAL_WEATHER = 'openmeteo'
  # Skip the parallel fuel dataset download at boot — with 3 concurrent
  # httpx clients pulling ~15 MB + parsing CSVs, the 512 MB VM OOM'd
  # and got killed mid-warmup. Datasets now load lazily on the first
  # /plan that needs them; that request is one-off slow (10–20 s cold)
  # but the machine stays alive.
  MYTRAVELPAL_SKIP_PREWARM = '1'

[http_service]
  internal_port = 8000
  force_https = true
  # Suspend mode (2026-08-26): Fly rolled out fast snapshot resume
  # (~250 ms typical) which is well inside the proxy's grace
  # window — the previous cold-boot mode was where we hit the
  # ">8 s = 503" race, that limitation is no longer present with
  # `suspend`. Cost drops from ~$13/mo (24/7 machine) to ~$5-8/mo
  # for F&F beta traffic. Revert to `off` if 503s reappear.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # Generous windows: /health is trivial but the same event loop
    # can be briefly starved by a large gov fuel dataset first-load.
    # `grace_period` covers uvicorn boot + the first /health warm-up;
    # `timeout` swallows short parse-time hiccups without killing the
    # machine.
    interval = '30s'
    timeout = '15s'
    grace_period = '30s'
    method = 'get'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  # 2 shared vCPUs so the event loop, dataset parsing thread and
  # concurrent httpx requests stop starving each other on a single
  # core (Nominatim POI + gov fuel + routing all fire from /plan and
  # can pile up behind one another → health check misses the window).
  cpus = 2
  # 2 GB gives generous headroom for the fuel datasets (Spain ~15 MB
  # JSON, Italy 22 k CSV rows expanded, France ZIP) while multiple
  # /plan requests are inflight. Previous 1 GB was surviving idle but
  # OOM-adjacent under load.
  memory_mb = 2048
