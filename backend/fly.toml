# fly.toml app configuration file generated for mytravelpal-api on 2026-08-21T22:41:17+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mytravelpal-api'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  MYTRAVELPAL_FIRES = 'effis'
  MYTRAVELPAL_ROUTING = 'osrm'
  MYTRAVELPAL_WEATHER = 'openmeteo'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
