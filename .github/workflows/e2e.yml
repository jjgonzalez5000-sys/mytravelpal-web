name: E2E smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Set up Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: Nexus 6
          script: |
            cd mobile
            flutter build apk --release --no-shrink --no-tree-shake-icons \
              --dart-define=API_BASE_URL=https://mytravelpal-api.fly.dev \
              --dart-define=API_KEY=${{ secrets.MYTRAVELPAL_API_KEY }} \
              --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
              --dart-define=APP_VERSION=0.0.0+ci
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            bash scripts/e2e.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: mobile/maestro/reports/
          retention-days: 7
