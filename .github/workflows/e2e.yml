name: E2E smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          df -h /

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter build apk --release --no-shrink --no-tree-shake-icons \
            --dart-define=API_BASE_URL=https://mytravelpal-api.fly.dev \
            --dart-define=API_KEY=${{ secrets.MYTRAVELPAL_API_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=APP_VERSION=0.0.0+ci

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      # The runner executes each script line in its own `sh -c`, so no line
      # may depend on a `cd` from a previous one. Paths are repo-root relative.
      - name: Run E2E on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: Nexus 6
          disk-size: 4096M
          emulator-boot-timeout: 1200
          script: |
            adb install -r mobile/build/app/outputs/flutter-apk/app-release.apk
            bash mobile/scripts/e2e.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: mobile/maestro/reports/
          retention-days: 7
